[package]
name = "tarkov-helper"
version = "0.2.0"
edition = "2024"
description = "Карта ценного лута Лаборатории для Escape from Tarkov"
repository = "https://github.com/bobisdacool1/TarkovHelper"

[dependencies]
anyhow = "1.0.104"
cargo-packager-updater = "0.2.3"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
futures = "0.3"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-segmentation = "1.13.3"
ureq = "2"

# GPUI без оптимизаций очень медленный: зависимости оптимизируем даже в dev,
# свой код остаётся быстро собираемым.
[profile.dev.package."*"]
opt-level = 3

# Сканер цен: снимок экрана, OCR (Windows.Media.Ocr), глобальные хуки, окна поверх игры.
# Та же версия, что у GPUI, — не собирается второй раз.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# Упаковка: cargo packager --release (см. README / .github/workflows/release.yml)
[package.metadata.packager]
product-name = "Tarkov Helper"
identifier = "io.github.bobisdacool1.tarkovhelper"
category = "Utility"
copyright = "bobisdacool1"
icons = ["assets/app-icon/*.png", "assets/windows/app.ico"]
out-dir = "dist"

[package.metadata.packager.macos]
minimum-system-version = "11.0"

[package.metadata.packager.nsis]
installer-mode = "currentUser"
